default_settings: null
behaviors:
  GFSX_Brain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 81920
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 1000000
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 128
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
      curiosity:
        gamma: 0.99
        strength: 0.05
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
        learning_rate: 0.0003
        encoding_size: null
    init_path: null
    keep_checkpoints: 10
    even_checkpoints: false
    max_steps: 50000000
    time_horizon: 192
    summary_freq: 50000
    threaded: false
    self_play: null
    behavioral_cloning: null
env_settings:
  env_path: Buildv6/ROS_test
  env_args: null
  base_port: 5005
  num_envs: 16
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
  no_graphics_monitor: false
environment_parameters:
  ball_max_distance:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4994
          value: 1.5
      name: Lesson0_Close
      completion_criteria:
        behavior: GFSX_Brain
        measure: reward
        min_lesson_length: 200
        signal_smoothing: true
        threshold: 2.5
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4995
          value: 2.5
      name: Lesson1_Medium
      completion_criteria:
        behavior: GFSX_Brain
        measure: reward
        min_lesson_length: 200
        signal_smoothing: true
        threshold: 4.0
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4996
          value: 4.0
      name: Lesson2_Far
      completion_criteria: null
  ball_max_offset:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4997
