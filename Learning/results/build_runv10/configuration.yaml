    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 5007
          value: 0.04
      name: Dropout_Real
      completion_criteria: null
checkpoint_settings:
  run_id: build_runv10
  initialize_from: null
  load_model: false
  resume: false
  force: true
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: null
debug: false
